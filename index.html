<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Клан Щербет: Возврат ресурсов</title>
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/InventivetalentDev/minecraft-assets/1.19.3/assets/minecraft/textures/block/grass_block_side.png">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ВЕРНУЛИ КАНВАС СЮДА -->
    <canvas id="bgCanvas"></canvas>
    
    <!-- Тултип -->
    <div id="mc-tooltip">
        <div class="tooltip-title">Предмет</div>
        <div class="tooltip-desc">minecraft:item</div>
    </div>

    <!-- Виньетка -->
    <div class="vignette-overlay"></div>

    <div class="main-container">
        <header>
            <h1 class="mc-title">КЛАН <span class="orange">ЩЕРБЕТ</span></h1>
            <p class="subtitle">Common World (beta) — Заявка на возврат</p>
        </header>

        <div class="inventory-panel">
            <div class="panel-header">
                <span>Chest: Refund List</span>
            </div>
            
            <div class="item-list" id="itemList"></div>

            <div class="panel-footer">
                <p>Всего позиций: <span id="totalItems" class="green">0</span></p>
            </div>
        </div>

        <button class="mc-button" onclick="copyToClipboard()">Скопировать список</button>
    </div>

    <audio id="clickSound" src="https://www.myinstants.com/media/sounds/minecraft_click.mp3"></audio>

    <script src="items.js"></script>

    <script>
        /* --- ГЕНЕРАТОР ФОНА (Прямая отрисовка, без CORS проблем) --- */
        const canvas = document.getElementById('bgCanvas');
        const ctx = canvas.getContext('2d');

        // Отключаем сглаживание СРАЗУ
        ctx.imageSmoothingEnabled = false;
        ctx.mozImageSmoothingEnabled = false;
        ctx.webkitImageSmoothingEnabled = false;

        const oreUrls = [
            'https://raw.githubusercontent.com/InventivetalentDev/minecraft-assets/1.19.3/assets/minecraft/textures/block/deepslate_coal_ore.png',
            'https://raw.githubusercontent.com/InventivetalentDev/minecraft-assets/1.19.3/assets/minecraft/textures/block/deepslate_copper_ore.png',
            'https://raw.githubusercontent.com/InventivetalentDev/minecraft-assets/1.19.3/assets/minecraft/textures/block/deepslate_diamond_ore.png',
            'https://raw.githubusercontent.com/InventivetalentDev/minecraft-assets/1.19.3/assets/minecraft/textures/block/deepslate_gold_ore.png',
            'https://raw.githubusercontent.com/InventivetalentDev/minecraft-assets/1.19.3/assets/minecraft/textures/block/deepslate_iron_ore.png',
            'https://raw.githubusercontent.com/InventivetalentDev/minecraft-assets/1.19.3/assets/minecraft/textures/block/deepslate_lapis_ore.png',
            'https://raw.githubusercontent.com/InventivetalentDev/minecraft-assets/1.19.3/assets/minecraft/textures/block/deepslate_redstone_ore.png',
            'https://raw.githubusercontent.com/InventivetalentDev/minecraft-assets/1.19.3/assets/minecraft/textures/block/deepslate_emerald_ore.png'
        ];

        const loadedImages = [];
        let imagesLoadedCount = 0;

        oreUrls.forEach(url => {
            const img = new Image();
            img.crossOrigin = "Anonymous";
            img.src = url;
            img.onload = () => {
                loadedImages.push(img);
                imagesLoadedCount++;
                if (imagesLoadedCount === oreUrls.length) {
                    drawBackground();
                }
            };
            // Если картинка не грузится (редкий случай), просто игнорируем
            img.onerror = () => { imagesLoadedCount++; };
        });

        function drawBackground() {
            // Подгоняем размер под окно
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            
            // ВАЖНО: Отключаем сглаживание снова после ресайза
            ctx.imageSmoothingEnabled = false;
            
            const blockSize = 64; 
            const cols = Math.ceil(canvas.width / blockSize);
            const rows = Math.ceil(canvas.height / blockSize);

            for (let y = 0; y < rows; y++) {
                for (let x = 0; x < cols; x++) {
                    const randomImg = loadedImages[Math.floor(Math.random() * loadedImages.length)];
                    if (randomImg) {
                        ctx.drawImage(randomImg, x * blockSize, y * blockSize, blockSize, blockSize);
                    }
                }
            }
        }
        
        // Перерисовываем при изменении размера окна
        window.addEventListener('resize', drawBackground);


        /* --- ЛОГИКА ТУЛТИПОВ --- */
        const tooltip = document.getElementById('mc-tooltip');
        const tooltipTitle = tooltip.querySelector('.tooltip-title');
        const tooltipDesc = tooltip.querySelector('.tooltip-desc');

        document.addEventListener('mousemove', (e) => {
            if (tooltip.style.display === 'block') {
                const x = e.clientX + 15;
                const y = e.clientY - 30;
                tooltip.style.left = Math.min(x, window.innerWidth - 180) + 'px'; 
                tooltip.style.top = y + 'px';
            }
        });

        function showTooltip(name, id) {
            tooltipTitle.innerText = name;
            tooltipDesc.innerText = "minecraft:" + id.toLowerCase();
            tooltip.style.display = 'block';
        }

        function hideTooltip() {
            tooltip.style.display = 'none';
        }

        /* --- РЕНДЕР СПИСКА --- */
        const listContainer = document.getElementById('itemList');
        const totalCountSpan = document.getElementById('totalItems');

        function renderItems() {
            let html = '';
            if (typeof resources === 'undefined') return;

            resources.forEach((item) => {
                const enchantClass = item.enchanted ? 'enchanted' : '';
                html += `
                <div class="item-row" 
                     onclick="toggleCheck(this)"
                     onmouseenter="showTooltip('${item.name}', '${item.id}')"
                     onmouseleave="hideTooltip()">
                     
                    <div class="item-icon ${enchantClass}">
                        <img src="https://minecraft.wiki/images/Invicon_${item.id}.png" alt="" onerror="this.style.display='none'">
                    </div>
                    <div class="item-name">${item.name}</div>
                    <div class="item-amount">x${item.amount}</div>
                </div>`;
            });
            listContainer.innerHTML = html;
            totalCountSpan.innerText = resources.length;
        }

        function toggleCheck(element) {
            element.classList.toggle('checked');
            const sound = document.getElementById('clickSound');
            sound.cloneNode(true).play().catch(()=>{}); 
        }

        function copyToClipboard() {
            const sound = document.getElementById('clickSound');
            sound.play().catch(()=>{});

            let text = "=== ЗАЯВКА НА ВОЗВРАТ (Common World) ===\n";
            text += `Клан: Щербет\nДата: ${new Date().toLocaleDateString()}\n---------------------------\n`;
            if (typeof resources !== 'undefined') {
                resources.forEach(item => { text += `• ${item.name}: ${item.amount}\n`; });
            }
            text += "---------------------------";

            navigator.clipboard.writeText(text).then(() => {
                const btn = document.querySelector('.mc-button');
                const originalText = btn.innerText;
                btn.innerText = "СКОПИРОВАНО!";
                btn.style.color = "#55FF55";
                setTimeout(() => {
                    btn.innerText = originalText;
                    btn.style.color = "";
                }, 2000);
            });
        }

        renderItems();
    </script>
</body>
</html>
